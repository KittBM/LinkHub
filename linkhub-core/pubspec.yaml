name: linkhub_core
description: "LinkHub Core"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # WebSocket
  web_socket_channel: ^3.0.2

  # Local database
  hive_flutter: ^1.1.0

  # Encryption (AES-256-GCM)
  pointycastle: ^3.9.1

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Network
  network_info_plus: ^6.1.3
  udp: ^5.0.3

  # Clipboard
  super_clipboard: ^0.9.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  shared_preferences: ^2.3.5
  permission_handler: ^11.3.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5

flutter:
  uses-material-design: true
