name: linkhub_mobile
description: "LinkHub - LinkHub Mobile"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # WebSocket server
  shelf: ^1.4.2
  shelf_web_socket: ^2.0.0
  web_socket_channel: ^3.0.2

  # Local database
  hive_flutter: ^1.1.0

  # Encryption
  pointycastle: ^3.9.1

  # QR Code display
  qr_flutter: ^4.1.0

  # Notifications (for foreground service notification)
  flutter_local_notifications: ^18.0.1

  # Network
  network_info_plus: ^6.1.3
  udp: ^5.0.3

  # Clipboard
  super_clipboard: ^0.9.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  shared_preferences: ^2.3.5
  permission_handler: ^11.3.1
  battery_plus: ^6.0.3
  connectivity_plus: ^6.1.3
  device_info_plus: ^11.3.3
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5

flutter:
  uses-material-design: true
